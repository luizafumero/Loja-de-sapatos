<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Imperio dos Calçados - Contato</title>
</head>

<body>

<header>
    <h1>Passo Certo</h1>

    <nav>
        <ul>
            <li><a href="index.html">Início</a></li>
            <li><a href="catalogo.html">Catálogo</a></li>
            <li><a href="contato.html">Contato</a></li>
        </ul>
    </nav>
</header>

<main>

    <section id="contato">
        <h2>Entre em contato</h2>

        <form>

            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome">

            <br><br>

            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email">

            <br><br>

            <label for="categoria">Categoria de interesse:</label>

            <select id="categoria" name="categoria">
                <option value="tenis">Tênis</option>
                <option value="sandalia">Sandália</option>
                <option value="bota">Bota</option>
                <option value="social">Sapato social</option>
            </select>

            <br><br>

            <p>Forma de contato preferida:</p>

            <label>
                <input type="radio" name="contato" value="email">
                E-mail
            </label>

            <label>
                <input type="radio" name="contato" value="telefone">
                Telefone
            </label>

            <br><br>

            <button type="submit">Enviar</button>

        </form>
    </section>

    <section id="informacoes">
        <h2>Informações</h2>
        <p>Atendimento de segunda a sábado.</p>
    </section>

    <aside>
        <h2>Precisa de ajuda?</h2>
        <p>Envie uma mensagem pelo formulário.</p>
    </aside>

</main>

<footer>
    <p>&copy; 2026 Passo Certo - Loja de Sapatos</p>
</footer>

</body>
</html>
